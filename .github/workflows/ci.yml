name: Server checks and development image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      auth-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: isolated_auth_test
          POSTGRES_DB: auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run quiet -- db:generate
      - run: npm run quiet -- build
      - run: npm run quiet -- typecheck
      - run: npm run quiet -- test
      - name: Better Auth compatibility, MFA, recovery, and private sync
        env:
          ULTRA_TEST_AUTH_ENGINE: better-auth
        run: npm run quiet -- test:native
      - name: Better Auth PostgreSQL refresh/security lock-order regression
        env:
          ULTRA_AUTH_TEST_DATABASE_URL: postgresql://auth_test:isolated_auth_test@localhost:5432/auth_test
        run: npm run quiet -- test:better-auth:postgres
      - run: npm run quiet -- test:server
      - run: npm audit --omit=dev --audit-level=high
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Account browser acceptance
        run: npm run quiet -- test:accounts:browser
      - name: Better Auth account browser acceptance
        env:
          ULTRA_TEST_AUTH_ENGINE: better-auth
        run: npm run quiet -- test:accounts:browser

  installation:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run quiet -- build:packages
      - name: Build candidate on its native architecture
        run: docker build -f apps/server/Dockerfile --build-arg VCS_REF=${{ github.sha }} -t ultra-tasks-server:dev -t ultra-tasks-server:sha-${{ github.sha }} .
      - name: Fresh install, concurrency, quota, restart, and restore
        env:
          ULTRA_LOAD_QUOTA: 'true'
        run: sh scripts/test-installation.sh
      - name: Check out initial private server for upgrade acceptance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: c8e2a39474477e2a57ebc73a6fad4ce57cef960d
          path: .tmp/upgrade-baseline
          persist-credentials: false
      - name: Build baseline from public source
        run: docker build -f .tmp/upgrade-baseline/apps/server/Dockerfile -t ultra-tasks-server:baseline .tmp/upgrade-baseline
      - name: Upgrade preserves authentication and encrypted data
        run: sh scripts/test-update.sh ultra-tasks-server:baseline ultra-tasks-server:sha-${{ github.sha }}
      - name: Preserve non-sensitive capacity measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: capacity-${{ matrix.runner }}
          path: .tmp/private-load.json
          if-no-files-found: error

  image:
    needs: [checks, installation]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked development revision
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/ultra-tasks/ultra-tasks-server:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package the matching operator bundle
        run: sh scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compose-${{ github.sha }}
          path: .tmp/releases/*
          if-no-files-found: error

  published-installation:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run quiet -- build:packages
      - name: Pull the published image without registry credentials
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull ghcr.io/ultra-tasks/ultra-tasks-server:sha-${{ github.sha }}
          docker tag ghcr.io/ultra-tasks/ultra-tasks-server:sha-${{ github.sha }} ultra-tasks-server:dev
      - name: Published image installs, syncs, and restores on its native architecture
        env:
          ULTRA_LOAD_DEVICES: '2'
          ULTRA_LOAD_RECORDS: '10'
        run: sh scripts/test-installation.sh
